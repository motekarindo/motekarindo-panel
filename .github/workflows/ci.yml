name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motekar_panel_test
          POSTGRES_USER: motekar
          POSTGRES_PASSWORD: motekar-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U motekar -d motekar_panel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Test
        run: make test

      - name: Test PostgreSQL integration
        env:
          MOTEKAR_TEST_ALLOW_DATABASE: "1"
          MOTEKAR_TEST_DATABASE_URL: postgres://motekar:motekar-test@127.0.0.1:5432/motekar_panel_test?sslmode=disable
        run: make test-integration-postgres

      - name: Test installers
        run: make test-installers

      - name: Test release artifacts
        run: make test-release-artifacts

      - name: Build
        run: make build
