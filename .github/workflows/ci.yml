name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Test
        run: make test

      - name: Test installers
        run: make test-installers

      - name: Build
        run: make build
